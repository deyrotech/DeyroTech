<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top py-3 px-4 transition-all" id="mainNavbar">
        <div class="container-fluid d-flex align-items-center justify-content-between">
            <div class="nav-side-item">
                <button class="btn border-0 p-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu" id="menu-toggle">
                    <i class="fas fa-bars-staggered fa-2x"></i>
                </button>
            </div>
            <a class="navbar-brand d-flex align-items-center m-0" href="index.html">

            </a>
        </div>
    </nav>

    <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu">
    <div class="offcanvas-header d-flex flex-column pt-5 position-relative">
        <div class="text-center w-100">
            <img src="assets/Logo-Web.png" alt="Logo" width="80" class="mb-2">
            <h5 class="fw-bold">Deyrotech</h5>
        </div>
        <button type="button" class="btn-close position-absolute top-0 end-0 m-4" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>

    <div class="offcanvas-body d-flex flex-column justify-content-center">
        <ul class="nav flex-column text-center">
            <li class="nav-item">
                <a class="nav-link py-3" href="index.html"><i class="fas fa-home me-2"></i> Home</a></li>
            <li class="nav-item">
                <a class="nav-link py-3" href="about.html"><i class="fas fa-info-circle me-2"></i> About Me</a></li>
            <li class="nav-item">
                <a class="nav-link py-3" href="services.html"><i class="fas fa-cogs me-2"></i> Services</a></li>
            <li class="nav-item">
                <a class="nav-link py-3" href="portofolio.html"><i class="fas fa-award me-2"></i> Portofolio</a> </li>

                <a class="nav-link py-3" href="contact.html"><i class="fas fa-paper-plane me-2"></i> Contact</a></li>
        </ul>
    </div>
</div>

    <main class="container mt-5 pt-5 pb-5">
        <div class="row g-5">
            <div class="col-lg-5 fade-up">
                <h6 class="text-primary fw-bold text-uppercase ls-wide mb-3">Contact Us</h6>
                <h2 class="display-5 fw-bold mb-4">Start Your Project</h2>
                <p class="text-muted mb-5">Free Consultation for IoT Needs and Academic Assistance.</p>
                
                <div class="contact-info-box d-flex align-items-start mb-4">
                    <div class="icon-circle me-3"><i class="fab fa-whatsapp"></i></div>
                    <div>
                        <h6 class="fw-bold mb-0">WhatsApp</h6>
                        <p class="text-muted">+62 859-2136-0729</p>
                    </div>
                </div>
                <div class="contact-info-box d-flex align-items-start mb-4">
                    <div class="icon-circle me-3"><i class="far fa-envelope"></i></div>
                    <div>
                        <h6 class="fw-bold mb-0">Email</h6>
                        <p class="text-muted">deyrotech@gmail.com</p>
                    </div>
                </div>
            </div>

            <div class="col-lg-7 fade-up">
                <div class="bg-white p-4 rounded-4 shadow-sm border">
                    <h5 class="fw-bold mb-4">Send a Quick Message</h5>
                    
                    <form id="whatsappForm">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="small fw-bold">Name</label>
                                <input type="text" id="name" class="form-control rounded-pill px-4" placeholder="Contoh: Budi Santoso" required>
                            </div>
                            <div class="col-md-6">
                                <label class="small fw-bold">Email Address</Address></label>
                                <input type="email" id="email" class="form-control rounded-pill px-4" placeholder="budi@email.com" required>
                            </div>
                            <div class="col-12">
                                <label class="small fw-bold">Your Message</label>
                                <textarea id="message" class="form-control rounded-4 px-4 py-3" rows="4" placeholder="Jelaskan kebutuhan Anda secara singkat..." required></textarea>
                            </div>
                            <div class="col-12 mt-4">
                                <button type="button" onclick="sendToWhatsApp()" class="btn btn-dark w-100 rounded-pill py-3 fw-bold">
                                    <i class="fab fa-whatsapp me-2"></i> Send To WhatsApp
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Fungsi Kirim ke WhatsApp
        function sendToWhatsApp() {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const message = document.getElementById('message').value;
            
            if (name === "" || email === "" || message === "") {
                alert("Harap isi semua kolom formulir sebelum mengirim!");
                return;
            }

            const phoneNumber = "6285921360729";
            const text = `Halo Deyrotech!\n\n` +
                         `Nama: ${name}\n` +
                         `Email: ${email}\n` +
                         `Pesan: ${message}`;

            const encodedText = encodeURIComponent(text);
            const whatsappURL = `https://wa.me/${phoneNumber}?text=${encodedText}`;
            
            window.open(whatsappURL, '_blank');
        }

        // Script Navbar Scroll
        window.addEventListener('scroll', function() {
            const nav = document.getElementById('mainNavbar');
            if (window.scrollY > 50) nav.classList.add('scrolled');
            else nav.classList.remove('scrolled');
        });
    </script>
</body>
</html>
